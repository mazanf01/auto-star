# ─── Docker Compose: Backend + Frontend (self-hosted) ───
# Untuk Oracle Cloud, VPS, atau local deploy.
# Backend + frontend dalam 1 compose, nginx reverse proxy di luar (opsional).
#
# Cara pakai:
#   1. cp backend/.env.production.example backend/.env
#   2. Edit backend/.env — isi JWT_SECRET, SUPABASE_URL, dll
#   3. docker-compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: star-asn-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - star-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: star-asn-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - star-net

networks:
  star-net:
    driver: bridge
