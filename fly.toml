# ─── Fly.io Config (fly.toml) ───────────────────────────────
# Deploy backend ke Fly.io (free tier, 3 shared-cpu-1x VM 512MB)
# Always-on: min_machines_running = 1
#
# Setup:
#   1. Install flyctl:   curl -L https://fly.io/install.sh | sh
#   2. Login:            flyctl auth login
#   3. Launch:           flyctl launch --no-deploy
#   4. Set secrets:      flyctl secrets set JWT_SECRET=... ENCRYPTION_KEY=... ...
#   5. Deploy:           flyctl deploy
#
# Frontend → Cloudflare Pages (lihat bagian bawah)

app = "star-asn-backend"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
